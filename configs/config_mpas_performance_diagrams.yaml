# Sample config: MPAS 100km vs. 400km (same pair as config_mpas_2threshold.yaml)
# demonstrating the full performance-diagram + two-system-diagnostic suite:
# case-scatter performance diagrams at short/medium/long lead-time periods
# (spanning the real 0-132h range), a lead-time trajectory diagram, a
# two-system CSI-difference performance diagram (colorbar), POD/FAR/
# FBIAS/CSI difference histograms across all matched initializations,
# POD-by-object-property heatmaps (area/max_intensity/age vs. lead time,
# plus a difference heatmap since exactly 2 systems are being compared),
# and storm-mode-filtered (cellular/mixed/linear) POD/FAR/FBIAS/CSI time
# series.
#
# area_bins uses a fixed 200 km^2 bin width up to 2000 km^2, then one
# final open-ended bin aggregating every object larger than that
# (per explicit user direction, not variable-width bins) -- this real
# dataset's own 99th percentile area is ~4113 km^2, so that overflow bin
# is genuinely exercised, not just a formality. max_intensity_bins was
# derived empirically from this real dataset's own 10th/50th/90th/99th
# percentiles (not guessed) -- max_intensity pct=[47, 52, 58, 64].
# age_bins is included too, but this real dataset predates the
# truth_age_seconds schema field (no tracked truth series was ever
# regenerated for it) -- the age heatmaps are expected to be skipped with
# an explicit "no real data" report, not silently blank, demonstrating
# that real failure mode end to end.
#
# "bring your own larger dataset" reference, points at ncar_mpas_analysis/,
# which is not bundled with this package.

systems:
  - name: 100km
    match_dir: ../../ncar_mpas_analysis/matched_objects_100km
  - name: 400km
    match_dir: ../../ncar_mpas_analysis/matched_objects_400km

lead_time:
  mode: intersection

metrics: [pod, far, fbias, csi]

bootstrap:
  samples: 1000
  ci_interval: 95

performance_diagrams:
  case_scatter:
    case_grouping: init_time    # MPAS: one case per real daily initialization
    marker_size_basis: truth
    periods:
      - name: "24h"
        lead_minutes_range: [1440, 1440]
      - name: "32-37h"
        lead_minutes_range: [1920, 2220]
      - name: "120h"
        lead_minutes_range: [7200, 7200]
  lead_time_trajectory:
    label_interval_minutes: 720   # every 12h

# Only valid for exactly 2 systems (confirmed here: 100km, 400km).
# case_scatter_periods/histogram_periods omitted -> reuses
# performance_diagrams.case_scatter.periods above for both features.
two_system_comparison:
  colormap: RdBu_r

heatmaps:
  area_bins: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, .inf]
  max_intensity_bins: [40, 45, 50, 55, 60, 65, 70]
  age_bins: [-3600, -1800, 0, 1800, 3600, 5400, 7200]

storm_mode_timeseries:
  modes: [cellular, mixed, linear]

output_dir: output/mpas_performance_diagrams

require_shared_cases: true
