# Real, runnable example: single MPAS forecast initialization (2023-04-24
# 00Z), ensemble "paintball" plot -- all 5 members overlaid on one shared
# domain per valid time, each member's own footprint colored by storm mode
# (cellular/mixed/linear), plus the MRMS truth footprint overlaid for
# verification context. Restricted to the 24-48h lead window (25 hourly
# images total) rather than the full forecast, per explicit request to keep
# the output set small. Storm mode is a property of each member's own
# identified objects, independent of any matching threshold -- no
# match_dir needed for this one.
#
# "bring your own larger dataset" reference, points at ncar_mpas_analysis/,
# which is not bundled with this package.

forecast_object_dir: ../../ncar_mpas_analysis/mpas_objects
mrms_object_dir: ../../ncar_mpas_analysis/mrms_objects
init_time: "2023-04-24T00:00:00"

color_by: storm_mode
paintball: true
show_mrms_overlay: true

members:
  mode: all

times:
  mode: range
  lead_minutes_range: [1440, 2880]  # 24h-48h, hourly

output_dir: output/object_spatial_maps/mpas_paintball_storm_mode
