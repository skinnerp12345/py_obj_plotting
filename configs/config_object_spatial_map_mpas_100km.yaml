# Real, runnable example: single MPAS forecast initialization (2023-04-24
# 00Z), full 5-member ensemble, first 48 hours, colored by match category
# (hit/miss/false_alarm/extra) against the 100km-matching-threshold match
# archive, with the MRMS truth overlay and instantaneous POD/FAR/FBIAS/CSI
# annotation that category mode always produces.
#
# "bring your own larger dataset" reference, points at ncar_mpas_analysis/,
# which is not bundled with this package.

forecast_object_dir: ../../ncar_mpas_analysis/mpas_objects
mrms_object_dir: ../../ncar_mpas_analysis/mrms_objects
match_dir: ../../ncar_mpas_analysis/matched_objects_100km
init_time: "2023-04-24T00:00:00"

color_by: category

members:
  mode: all

times:
  mode: range
  lead_minutes_range: [0, 2880]  # first 48 hours, hourly

output_dir: output/object_spatial_maps/mpas_100km
