# Real, runnable example: single WoFS (vlab) forecast initialization
# (2026-04-27 17Z), one representative member (mem00), full available
# forecast length (73 five-minute times, ~6h), colored by storm mode
# (cellular/mixed/linear) with the MRMS truth overlay.
#
# "bring your own larger dataset" reference, points at sfe_poster/, which
# is not bundled with this package.

forecast_object_dir: ../../sfe_poster/sfe_objects/wofs_vlab_obj/20260427
mrms_object_dir: ../../sfe_poster/sfe_objects/mrms_obj
init_time: "2026-04-27T17:00:00"

color_by: storm_mode
show_mrms_overlay: true

members:
  mode: single
  members: [mem00]

times:
  mode: full

output_dir: output/object_spatial_maps/wofs_nowcastnet/wofs
